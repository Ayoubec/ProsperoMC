name: Launcher and frontend checks
on: [push, pull_request]
jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: bash scripts/build-launcher.sh
      - run: bash tests/frontend/run.sh
      - run: bash tests/runtime/run.sh
      - run: python3 -m unittest discover -s tests/launcher -p 'test_*.py' -v
